<div class="w-full h-screen bg-black flex flex-col justify-center items-center gap-2">
  <div class="w-fit h-fit flex flex-row justify-center items-center gap-4 bg-gray-900 border-2 border-solid border-gray-800 p-3 rounded-lg ">
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">focalLength</p>
      <input #fl type="range" min="0" max="2000" value="500" (input)="canvas.changeFocalLength(fl.valueAsNumber)">
    </div>
    <div class="w-fit h-fit flex flex-row justify-center items-center">
      <p class="text-xs text-gray-500">drawCenterLines: </p>
      <input #lines type="checkbox" checked (input)="canvas.toggleLines(lines.checked)">
    </div>
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">cameraX</p>
      <input #camX type="range" min="-1000" max="1000" value="0"
      (input)="canvas.changeCameraPosition(camX.valueAsNumber, camY.valueAsNumber, camZ.valueAsNumber, camYaw.valueAsNumber, camPitch.valueAsNumber, camRoll.valueAsNumber)">
    </div>
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">cameraY</p>
      <input #camY type="range" min="-1000" max="1000" value="0"
      (input)="canvas.changeCameraPosition(camX.valueAsNumber, camY.valueAsNumber, camZ.valueAsNumber, camYaw.valueAsNumber, camPitch.valueAsNumber, camRoll.valueAsNumber)">
    </div>
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">cameraZ</p>
      <input #camZ type="range" min="-1000" max="1000" value="0"
      (input)="canvas.changeCameraPosition(camX.valueAsNumber, camY.valueAsNumber, camZ.valueAsNumber, camYaw.valueAsNumber, camPitch.valueAsNumber, camRoll.valueAsNumber)">
    </div>
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">cameraYaw</p>
      <input #camYaw type="range" min="-1000" max="1000" value="0"
      (input)="canvas.changeCameraPosition(camX.valueAsNumber, camY.valueAsNumber, camZ.valueAsNumber, camYaw.valueAsNumber, camPitch.valueAsNumber, camRoll.valueAsNumber)">
    </div>
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">cameraPitch</p>
      <input #camPitch type="range" min="-1000" max="1000" value="0"
      (input)="canvas.changeCameraPosition(camX.valueAsNumber, camY.valueAsNumber, camZ.valueAsNumber, camYaw.valueAsNumber, camPitch.valueAsNumber, camRoll.valueAsNumber)">
    </div>
    <div class="w-fit h-fit flex flex-col justify-center items-center">
      <p class="text-xs text-gray-500">cameraRoll</p>
      <input #camRoll type="range" min="-1000" max="1000" value="0"
      (input)="canvas.changeCameraPosition(camX.valueAsNumber, camY.valueAsNumber, camZ.valueAsNumber, camYaw.valueAsNumber, camPitch.valueAsNumber, camRoll.valueAsNumber)">
    </div>
  </div>
  <app-canvas #canvas />
</div>
